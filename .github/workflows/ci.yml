name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{matrix.emacs}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "30.1"]
    steps:
      - uses: actions/checkout@v6

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{matrix.emacs}}

      - name: Byte-compile
        run: emacs --batch -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile nlpplus-ts-mode.el

      # Builds all five grammars from the branch that matches this Emacs's
      # tree-sitter library.
      - name: Install the grammars
        run: |
          emacs --batch -L . -l nlpplus-ts-mode \
            --eval '(message "tree-sitter ABI %s, revision %s" (treesit-library-abi-version) (nlpplus-ts-mode--revision))' \
            -f nlpplus-ts-mode-install-grammars

      - name: Run the tests
        run: emacs --batch -L . -l test/nlpplus-ts-mode-tests.el -f ert-run-tests-batch-and-exit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"

      - name: checkdoc
        run: |
          emacs --batch --eval '(progn
            (require (quote checkdoc))
            (setq checkdoc-diagnostic-buffer "*warn*")
            (checkdoc-file "nlpplus-ts-mode.el")
            (with-current-buffer "*warn*"
              (when (> (buffer-size) 0)
                (princ (buffer-string))
                (kill-emacs 1))))'

      - name: package-lint
        run: |
          emacs --batch --eval '(progn
            (require (quote package))
            (add-to-list (quote package-archives) (quote ("melpa" . "https://melpa.org/packages/")) t)
            (package-initialize)
            (package-refresh-contents)
            (package-install (quote package-lint)))'
          emacs --batch --eval '(progn (package-initialize) (require (quote package-lint)))' \
            -f package-lint-batch-and-exit nlpplus-ts-mode.el
